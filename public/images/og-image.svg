<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #0b0505; stop-opacity: 1" />
      <stop offset="100%" style="stop-color: #1a1210; stop-opacity: 1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#grad)" />

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="rgba(230,190,26,0.08)" />
  <circle cx="1100" cy="530" r="200" fill="rgba(230,190,26,0.08)" />

  <!-- Main Title -->
  <text
    x="600"
    y="280"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="80"
    font-weight="bold"
    fill="#e6be1a"
    text-anchor="middle"
  >My Web Tool</text>

  <!-- Subtitle -->
  <text
    x="600"
    y="360"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="32"
    fill="rgba(219,219,215,0.95)"
    text-anchor="middle"
  >A Free, Open-Source Web Tool</text>

  <!-- Footer -->
  <text
    x="600"
    y="550"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="24"
    font-weight="600"
    fill="rgba(219,219,215,0.9)"
    text-anchor="middle"
  >Powered by Bobadilla Tech</text>
</svg>
